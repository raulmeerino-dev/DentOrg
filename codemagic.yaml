workflows:
  android-apk:
    name: DentOrg Android APK
    max_build_duration: 60
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Ensure Android platform exists
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync Capacitor project
        script: npm run mobile:sync
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

  ios-ipa:
    name: DentOrg iOS IPA (AltStore)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        XCODE_SCHEME: "App"
        XCODE_CONFIGURATION: "Release"
        IPA_NAME: "DentOrg-unsigned.ipa"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Ensure iOS platform exists
        script: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi
      - name: Sync Capacitor project
        script: npm run mobile:sync
      - name: Build unsigned IPA for AltStore
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration "$XCODE_CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          mkdir -p Payload
          cp -R "build/Build/Products/${XCODE_CONFIGURATION}-iphoneos/App.app" Payload/
          /usr/bin/zip -r "$IPA_NAME" Payload
          mv "$IPA_NAME" ../../
    artifacts:
      - ios/*.ipa
