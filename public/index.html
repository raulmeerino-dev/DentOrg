<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>DentOrg</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a href="#content" class="skip-link">Saltar al contenido</a>
    <header class="topbar">
      <div class="brand">
        <h1><button type="button" id="openSessionBtn" class="brand-session-trigger">👤 DentOrg</button><span id="activeSessionName" class="active-session-name">Sin iniciar</span></h1>
        <p>Gestion clinica conectada en tiempo real</p>
      </div>
      <div class="topbar-right">
        <button type="button" id="topbarThemeToggle" class="dark-mode-switch" title="Modo oscuro" aria-pressed="false">🌙</button>
        <div class="status" id="connectionStatus" aria-live="polite">Conectando...</div>
      </div>
    </header>

    <main class="layout">
      <nav class="sidebar" id="sidebar"></nav>
      <section class="content" id="content" tabindex="-1"></section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
